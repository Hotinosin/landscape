name: sync main WebUI

on:
  push:
    branches: ['main-webui']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install OpenAPI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev libelf-dev pkg-config zlib1g-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Export OpenAPI contract
        run: cargo test -p landscape-webserver export_openapi_json -- --nocapture

      - name: Checkout public WebUI repository
        uses: actions/checkout@v6
        with:
          repository: Hotinosin/landscape-webui
          ssh-key: ${{ secrets.WEBUI_SYNC_KEY }}
          path: public-webui

      - name: Project WebUI sources
        run: |
          rsync -a --delete landscape-webui/ public-webui/landscape-webui/
          rsync -a --delete landscape-types/ public-webui/landscape-types/
          cp package.json pnpm-lock.yaml pnpm-workspace.yaml public-webui/
          cp .github/webui-repository/release.yml public-webui/.github/workflows/release.yml
          cp .github/webui-repository/README.md public-webui/README.md

      - name: Push changed projection
        working-directory: public-webui
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git add -f landscape-types/openapi.json
          git diff --cached --quiet && exit 0
          git commit -m "sync: Hotinosin/landscape main-webui@${GITHUB_SHA}"
          git push
