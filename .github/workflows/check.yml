name: Code Quality Check

on:
  push:
    branches:
      - main
      - custom
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - custom

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang curl gcc llvm make pkg-config libelf-dev libclang-dev zlib1g-dev zstd

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Setup sccache
        run: |
          wget -qO- https://github.com/mozilla/sccache/releases/download/v0.12.0/sccache-v0.12.0-x86_64-unknown-linux-musl.tar.gz | sudo tar -xzf - -C /usr/local/bin/ --strip-components=1
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - name: Setup cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/sccache
          key: ${{ runner.os }}-check-${{ github.sha }}
          restore-keys: ${{ runner.os }}-check-

      - name: Check Rust code
        run: cargo check --locked --workspace --features metric-persistent,mem-track

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets --features metric-persistent,mem-track -- -D warnings

      - name: Run clippy (feature matrix)
        run: |
          cargo clippy --locked -p landscape-metric --no-default-features -- -D warnings
          cargo clippy --locked -p landscape-webserver --no-default-features -- -D warnings
          cargo clippy --locked -p landscape-common --features mem-track -- -D warnings
          cargo clippy --locked -p landscape-common --features openapi -- -D warnings

  config-cli-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang curl gcc llvm make pkg-config libelf-dev libclang-dev zlib1g-dev zstd

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Setup sccache
        run: |
          wget -qO- https://github.com/mozilla/sccache/releases/download/v0.12.0/sccache-v0.12.0-x86_64-unknown-linux-musl.tar.gz | sudo tar -xzf - -C /usr/local/bin/ --strip-components=1
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - name: Setup cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/sccache
          key: ${{ runner.os }}-e2e-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-e2e-
            ${{ runner.os }}-check-

      - name: Run core unit tests
        run: cargo test --locked -p landscape-common -p landscape-core -p landscape-dns --lib

      - name: Build landscape-webserver
        run: cargo build --locked -p landscape-webserver

      - name: Webserver regression tests and OpenAPI export
        run: cargo test --locked -p landscape-webserver --bin landscape-webserver

      - uses: actions/upload-artifact@v7
        with:
          name: checked-openapi
          path: landscape-types/openapi.json

      - name: Run config CLI end-to-end tests
        run: ./scripts/config_cli_test.sh target/debug/landscape-webserver

  rust-format-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt

      - name: Check Rust version
        run: rustc --version

      - name: Check Rust code formatting
        run: cargo fmt --all -- --check

  c-format-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18

      - name: Check C code formatting
        run: |
          clang-format-18 --version
          find landscape-ebpf/src/bpf -type f \( -name '*.c' -o -name '*.h' \) \
            ! -name 'vmlinux.h' \
            -print0 | xargs -0 clang-format-18 --dry-run --Werror

  frontend-check:
    needs: config-cli-e2e
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: checked-openapi
          path: landscape-types

      - name: Generate API bindings
        run: bun run --cwd landscape-types generate

      - name: Frontend tests and build
        run: |
          bun run --cwd landscape-webui test
          bun run --cwd landscape-webui build

      - name: Check frontend code formatting
        run: bun run --cwd landscape-webui format:check
