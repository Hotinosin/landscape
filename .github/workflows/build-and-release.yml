name: build and release

on:
  push:
    branches:
      - 'feature/extensions'

permissions:
  contents: write

env:
  sccache_version: 'v0.12.0'

jobs:
  linux-build:
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-22.04
            architecture: x86_64
            target: x86_64-unknown-linux-gnu
            toolchain: stable
            bindgen: false
            gateway: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang curl gcc llvm make pkg-config libelf-dev libclang-dev zlib1g-dev zstd

      - name: Setup sccache
        run: |
          sccache_arch=${{ matrix.settings.architecture }}
          wget -qO- https://github.com/mozilla/sccache/releases/download/${sccache_version}/sccache-${sccache_version}-${sccache_arch}-unknown-linux-musl.tar.gz | sudo tar -xzf - -C /usr/local/bin/ --strip-components=1
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - name: Setup rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.settings.toolchain }}
          targets: ${{ matrix.settings.target }}
          components: rustfmt

      - name: Setup cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/sccache
          key: ${{ runner.os }}-${{ matrix.settings.target }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ matrix.settings.target }}-

      - name: Build binaries
        run: |
            if [ "${{ matrix.settings.bindgen }}" = "true" ]; then
              cargo install --force --locked bindgen-cli
            fi
            if [ "${{ matrix.settings.gateway }}" = "true" ]; then
              cargo build --release --target ${{ matrix.settings.target }} --features metric-persistent
            else
              cargo build --release --target ${{ matrix.settings.target }} --no-default-features --features metric-persistent
            fi
            cargo build --release --package landscape-ebpf --bin redirect_pkg_handler --target ${{ matrix.settings.target }}
            mkdir -p output
            cp target/${{ matrix.settings.target }}/release/landscape-webserver output/landscape-webserver-${{ matrix.settings.architecture }}
            cp target/${{ matrix.settings.target }}/release/redirect_pkg_handler output/redirect_pkg_handler-${{ matrix.settings.architecture }}

      - name: Export OpenAPI spec
        if: matrix.settings.architecture == 'x86_64'
        run: cargo test -p landscape-webserver export_openapi_json -- --nocapture

      - name: Upload OpenAPI spec
        if: matrix.settings.architecture == 'x86_64'
        uses: actions/upload-artifact@v7
        with:
          name: openapi-spec
          path: landscape-types/openapi.json

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: landscape-webserver-${{ matrix.settings.target }}
          path: output/*

  # 交叉编译（cargo-zigbuild + 发行版 sysroot，见 scripts/build_musl_static.sh
  # 与 scripts/build_gnu.sh）：
  #   - musl 目标：全静态单文件，无 so 依赖，产物 landscape-webserver-<arch>-static
  #     （s390x 无 musl std，Rust Tier 3，不参与）
  #   - gnu 目标：动态链接 glibc（运行时依赖目标机 libc/libelf.so），产物
  #     landscape-webserver-<arch>，与原生发行版行为一致；sysroot 取 Ubuntu
  #     noble ports（riscv64/s390x）与 Debian sid（loong64），替代原先的
  #     gcc 交叉工具链与源码编译 zlib/elfutils
  # Cross-compilation (cargo-zigbuild + distro sysroots, see
  # scripts/build_musl_static.sh and scripts/build_gnu.sh):
  #   - musl targets: fully static single-file artifacts with no .so deps,
  #     named landscape-webserver-<arch>-static (s390x has no musl std and is
  #     excluded)
  #   - gnu targets: dynamically linked glibc binaries (runtime deps on the
  #     target libc/libelf.so), named landscape-webserver-<arch>, matching
  #     native distro behavior; sysroots come from Ubuntu noble ports
  #     (riscv64/s390x) and Debian sid (loong64), replacing the previous gcc
  #     cross toolchains and from-source zlib/elfutils builds
  linux-cross-build:
    if: github.ref_name == 'feature/extensions'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        settings:
          # ---- 全静态 musl / fully static musl ----
          - architecture: x86_64
            target: x86_64-unknown-linux-musl
            gateway: true

          - architecture: aarch64
            target: aarch64-unknown-linux-musl
            gateway: true

          - architecture: riscv64
            target: riscv64gc-unknown-linux-musl
            gateway: true

          - architecture: loongarch64
            target: loongarch64-unknown-linux-musl
            gateway: true

          # ---- 动态 gnu / dynamic glibc ----
          - architecture: riscv64
            target: riscv64gc-unknown-linux-gnu
            gateway: true

          - architecture: s390x
            target: s390x-unknown-linux-gnu
            gateway: true

          - architecture: loongarch64
            target: loongarch64-unknown-linux-gnu
            gateway: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang curl gcc make pkg-config python3-pip wget file libelf-dev zlib1g-dev libclang-dev

      - name: Setup sccache
        run: |
          wget -qO- https://github.com/mozilla/sccache/releases/download/${sccache_version}/sccache-${sccache_version}-x86_64-unknown-linux-musl.tar.gz | sudo tar -xzf - -C /usr/local/bin/ --strip-components=1
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - name: Setup rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Setup cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/sccache
            ~/sysroots
          key: ${{ runner.os }}-cross-${{ matrix.settings.target }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-cross-${{ matrix.settings.target }}-

      - name: Setup zig and cargo-zigbuild
        run: |
          sudo pip3 install --break-system-packages ziglang==0.16.0
          cargo install --locked cargo-zigbuild --version 0.23.4

      - name: Build binaries
        run: |
          SCRIPT=build_gnu.sh
          if [[ "${{ matrix.settings.target }}" == *-musl ]]; then
            SCRIPT=build_musl_static.sh
          fi
          GATEWAY=${{ matrix.settings.gateway }} ./scripts/$SCRIPT ${{ matrix.settings.target }}

      - name: Verify static linking
        if: contains(matrix.settings.target, 'musl')
        run: |
          file output/landscape-webserver-${{ matrix.settings.architecture }}-static
          if readelf -d output/landscape-webserver-${{ matrix.settings.architecture }}-static | grep -q NEEDED; then
            echo "::error::Static artifact has dynamic dependencies"
            exit 1
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: landscape-webserver-${{ matrix.settings.target }}${{ contains(matrix.settings.target, 'musl') && '-static' || '' }}
          path: output/*
  build-front:
    needs: linux-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download OpenAPI spec
        uses: actions/download-artifact@v8
        with:
          name: openapi-spec
          path: landscape-types

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Build frontend
        run: |
          mkdir -p output
          pnpm install --frozen-lockfile
          pnpm --filter @landscape-router/types generate

          # Copy Scalar API Reference resources
          mkdir -p landscape-webui/public/scalar
          cp landscape-webui/node_modules/@scalar/api-reference/dist/browser/standalone.js landscape-webui/public/scalar/
          cp landscape-webui/node_modules/@scalar/api-reference/dist/style.css landscape-webui/public/scalar/

          pnpm --filter landscape-webui build
          cd landscape-webui
          mkdir static
          # Merge dist and public/scalar into static
          cp -r dist/* static/
          if [ -d public/scalar ]; then
            mkdir -p static/scalar
            cp public/scalar/*.js static/scalar/ 2>/dev/null || true
            cp public/scalar/*.css static/scalar/ 2>/dev/null || true
          fi
          zip -r ../output/static.zip static
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Upload frontend
        uses: actions/upload-artifact@v7
        with:
          name: landscape-frontend-none-all
          path: output/static.zip

  publish:
    if: github.ref_name == 'feature/extensions'
    runs-on: ubuntu-latest
    needs: [linux-build, linux-cross-build, build-front]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Resolve release metadata
        run: |
          BASE_VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          if ! [[ "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-extension\.[0-9]+$ ]]; then
            echo "extension version must be SemVer like 0.24.3-extension.1: ${BASE_VERSION}" >&2
            exit 1
          fi
          echo "BASE_VERSION=${BASE_VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v${BASE_VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=Landscape ${BASE_VERSION}" >> "$GITHUB_ENV"

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          pattern: landscape-*
          path: output
          merge-multiple: true

      - name: Download OpenAPI spec
        uses: actions/download-artifact@v8
        with:
          name: openapi-spec
          path: output

      - name: Compress backend for lkit repository
        run: zstd --ultra -19 --threads=0 --keep output/landscape-webserver-x86_64

      - name: Ensure lkit version is immutable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(curl -sS -o /tmp/lkit-manifest.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/releases/${BASE_VERSION}/manifest.json?ref=lkit-repository")
          case "$status" in
            404) ;;
            200)
              echo "lkit repository version ${BASE_VERSION} is already published; bump the package version" >&2
              exit 1
              ;;
            *)
              echo "Unable to verify lkit repository version (HTTP ${status})" >&2
              exit 1
              ;;
          esac

      - name: Generate SHASUM
        run: |
          cd output
          sha256sum * > SHASUM256sum.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.RELEASE_NAME }}
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          body: |
            Auto-generated from `${{ github.ref_name }}` at `${{ github.sha }}`.
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate lkit HTTP repository metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_URL: https://github.com/${{ github.repository }}/releases/download
        run: |
          mkdir -p lkit-repository/channels lkit-repository/releases/${BASE_VERSION}
          printf '{"protocol_version":1}\n' > lkit-repository/repository.json

          current_stable=$(curl -fsS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/channels/stable.json?ref=lkit-repository" \
            | jq -r '.version // empty' || true)
          if [ -z "$current_stable" ] || dpkg --compare-versions "$BASE_VERSION" gt "$current_stable"; then
            printf '{"protocol_version":1,"version":"%s"}\n' "$BASE_VERSION" > lkit-repository/channels/stable.json
          fi

          backend=output/landscape-webserver-x86_64.zst
          static=output/static.zip
          jq -n \
            --arg version "$BASE_VERSION" \
            --arg backend_url "${REPOSITORY_URL}/${RELEASE_TAG}/landscape-webserver-x86_64.zst" \
            --arg backend_sha256 "$(sha256sum "$backend" | cut -d ' ' -f 1)" \
            --argjson backend_size "$(stat -c %s "$backend")" \
            --arg static_url "${REPOSITORY_URL}/${RELEASE_TAG}/static.zip" \
            --arg static_sha256 "$(sha256sum "$static" | cut -d ' ' -f 1)" \
            --argjson static_size "$(stat -c %s "$static")" \
            '{
              protocol_version: 1,
              version: $version,
              assets: {
                webserver: {
                  x86_64: {
                    url: $backend_url,
                    sha256: $backend_sha256,
                    size: $backend_size
                  }
                },
                static: {
                  url: $static_url,
                  sha256: $static_sha256,
                  size: $static_size
                }
              }
            }' > lkit-repository/releases/${BASE_VERSION}/manifest.json

          jq -e \
            --arg version "$BASE_VERSION" \
            '.protocol_version == 1 and .version == $version and
             (.assets.webserver.x86_64.size > 0) and (.assets.static.size > 0)' \
            lkit-repository/releases/${BASE_VERSION}/manifest.json > /dev/null
          zstd --test "$backend"

      - name: Publish lkit HTTP repository metadata
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: lkit-repository
          publish_dir: ./lkit-repository
          keep_files: true
