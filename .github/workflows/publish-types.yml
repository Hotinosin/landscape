name: Publish Types to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.14.0)'
        required: true

jobs:
  publish-types:
    runs-on: ubuntu-22.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang curl gcc llvm make pkg-config libelf-dev libclang-dev zlib1g-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0

      - name: Generate OpenAPI spec
        run: cargo test --locked -p landscape-webserver export_openapi_json -- --nocapture

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies & generate types
        run: |
          bun install --frozen-lockfile
          bun run --cwd landscape-types generate

      - name: Set version
        env:
          TYPES_VERSION: ${{ inputs.version }}
        run: |
          bun -e 'const version = process.env.TYPES_VERSION; if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) throw new Error("Invalid package version"); const path = "landscape-types/package.json"; const pkg = await Bun.file(path).json(); await Bun.write(path, JSON.stringify({ ...pkg, version }, null, 2) + "\n");'

      - name: Publish to npm
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          cd landscape-types && bun publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
