<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const cached = localStorage.getItem("landscape-theme");
        let preference = "system";
        if (cached) {
          try {
            const parsed = JSON.parse(cached);
            preference =
              parsed?.version === 2 &&
              ["system", "light", "dark"].includes(parsed.preference)
                ? parsed.preference
                : "system";
          } catch {
            preference = ["system", "light", "dark"].includes(cached)
              ? cached
              : "system";
          }
        }
        const resolved =
          preference === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : preference === "light"
              ? "light"
              : "dark";
        const root = document.documentElement;
        root.dataset.theme = resolved;
        const radii = {
          none: "0px",
          "extra-small": "0.25rem",
          small: "0.375rem",
          medium: "0.5rem",
          large: "0.75rem",
          full: "9999px",
        };
        const legacyRadius = {
          sharp: "extra-small",
          default: "medium",
          rounded: "large",
        };
        const storedRadius = localStorage.getItem("landscape-radius");
        const storedFormRadius = localStorage.getItem("landscape-form-radius");
        const radius = legacyRadius[storedRadius] || storedRadius;
        const formRadius = legacyRadius[storedFormRadius] || storedFormRadius;
        const accent = Number(localStorage.getItem("landscape-accent"));
        const base = Number(localStorage.getItem("landscape-base"));
        root.dataset.radius = radius in radii ? radius : "extra-small";
        root.dataset.formRadius =
          formRadius in radii ? formRadius : "extra-small";
        root.style.setProperty("--radius", radii[root.dataset.radius]);
        root.style.setProperty(
          "--field-radius",
          radii[root.dataset.formRadius],
        );
        root.style.setProperty(
          "--theme-base-chroma",
          Number.isFinite(base) && base >= 0 && base <= 0.05 ? base : 0.01,
        );
        const hue =
          Number.isFinite(accent) && accent >= 0 && accent <= 360
            ? accent
            : 273.85;
        const accentColor = `oklch(57.74% 0.2091 ${hue})`;
        root.style.setProperty("--accent", accentColor);
        root.style.setProperty("--accent-foreground", "#ffffff");
        root.style.setProperty("--focus", accentColor);
        root.style.setProperty("--link", accentColor);
        root.classList.toggle("light", resolved === "light");
        root.classList.toggle("dark", resolved === "dark");
        root.style.colorScheme = resolved;
      })();
    </script>
    <title>Landscape UI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/react/main.tsx"></script>
  </body>
</html>
