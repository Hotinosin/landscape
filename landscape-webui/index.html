<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const cached = localStorage.getItem("landscape-theme");
        let preference = "system";
        if (cached) {
          try {
            const parsed = JSON.parse(cached);
            preference =
              parsed?.version === 2 &&
              ["system", "light", "dark"].includes(parsed.preference)
                ? parsed.preference
                : "system";
          } catch {
            preference = ["system", "light", "dark"].includes(cached)
              ? cached
              : "system";
          }
        }
        const resolved =
          preference === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : preference === "light"
              ? "light"
              : "dark";
        const root = document.documentElement;
        root.dataset.theme = resolved;
        root.dataset.radius = ["sharp", "default", "rounded"].includes(
          localStorage.getItem("landscape-radius"),
        )
          ? localStorage.getItem("landscape-radius")
          : "default";
        root.classList.toggle("light", resolved === "light");
        root.classList.toggle("dark", resolved === "dark");
        root.style.colorScheme = resolved;
      })();
    </script>
    <title>Landscape UI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/react/main.tsx"></script>
  </body>
</html>
