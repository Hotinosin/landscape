<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const cached = localStorage.getItem("landscape-theme");
        let preference = "system";
        if (cached) {
          try {
            const parsed = JSON.parse(cached);
            preference = parsed?.version === 2 ? parsed.preference : "system";
          } catch {
            preference = ["system", "light", "dark"].includes(cached)
              ? cached
              : "system";
          }
        }
        const resolved =
          preference === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : preference;
        const root = document.documentElement;
        root.dataset.theme = resolved;
        root.dataset.radius =
          localStorage.getItem("landscape-radius") || "default";
        root.classList.add(resolved);
        root.style.colorScheme = resolved;
      })();
    </script>
    <title>Landscape React Shell</title>
  </head>
  <body>
    <div id="react-root"></div>
    <script type="module" src="/src/react/main.tsx"></script>
  </body>
</html>
